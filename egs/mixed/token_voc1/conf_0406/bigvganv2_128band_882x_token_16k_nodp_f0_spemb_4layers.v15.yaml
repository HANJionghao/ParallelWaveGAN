# This configuration is based on BigVGAN-v2, derived
# from official repository (https://github.com/NVIDIA/BigVGAN).

# for 16k pre-trained model token, like HuBERT, WavLM, XSL-R...

# Differences from bigvganv2 settings:
# - add f0
# - add spemb
# - use multi-layered tokens with embedding layers instead of mel

###########################################################
#                FEATURE EXTRACTION SETTING               #
###########################################################
sampling_rate: 44100     # Sampling rate.
fft_size: null           # FFT size.
hop_size: 882            # Hop size. 320 * 44100 / 16000 = 882
win_length: null         # Window length.
                         # If set to null, it will be the same as fft_size.
window: null             # Window function.
num_mels: 1              # Number of mel basis.
fmin: null               # Minimum freq in mel basis calculation.
fmax: null               # Maximum frequency in mel basis calculation.
global_gain_scale: 1.0   # Will be multiplied to all of waveform.
trim_silence: false      # Whether to trim the start and end of silence.
format: "hdf5"           # Feature file format. "npy" or "hdf5" is supported.

###########################################################
#         GENERATOR NETWORK ARCHITECTURE SETTING          #
###########################################################
generator_type: DiscreteSymbolBigVGAN
generator_params:
    in_channels: 768                      # Number of input channels.
    out_channels: 1                       # Number of output channels.
    channels: 1536                        # Number of initial channels.
    kernel_size: 7                        # Kernel size of initial and final conv layers.
    upsample_scales: [7, 7, 3, 3, 2]      # Upsampling scales. 7*7*3*3*2 = 882
    upsample_kernel_sizes: [15, 15, 7, 7, 4] # Kernel size for upsampling layers.
    resblock: "AMPBlock1"
    resblock_kernel_sizes: [3, 7, 11]     # Kernel size for residual blocks.
    resblock_dilations:                   # Dilations for residual blocks.
        - [1, 3, 5]
        - [1, 3, 5]
        - [1, 3, 5]
    nonlinear_activation: "snakebeta" # Nonlinear activation type. change from "activation" to nonlinear_activation
    nonlinear_activation_params:
        snake_logscale: true
    use_tanh_at_final: false
    use_bias_at_final: false
    use_cuda_kernel: false
    use_weight_norm: true                 # Whether to apply weight normalization.

    num_tokens: 1025
    num_token_layers: 4                   # Number of layers used
    use_weight_sum: true                  # Whether to apply weight sum
    use_learned_weights: true             # Whether to fix parameter of weight sum (for Residual cluster layer)

    use_f0: true                          # Whether to use f0 # TODO(jhan7): added this to align with hifigan params, should modify bigvgan to reflect this
    f0_embedding_dim: 768                 # Number of Linear channels(f0).

    num_speakers: 0                       # Number of speakers if using speaker id.
    use_speaker_embedding: true                   # Whether to use speaker embedding.
    speaker_embedding_dim: 192                      # Speaker embedding dimension. # TODO(jhan7): added this to align with hifigan params, should modify bigvgan to reflect this
    speaker_feature_fusion: "fc_add"


###########################################################
#       DISCRIMINATOR NETWORK ARCHITECTURE SETTING        #
###########################################################
discriminator_type: BigVGANMultiResolutionMultiPeriodDiscriminator
discriminator_params:
    mrd_type: MultiScaleSubbandCQTDiscriminator
    mrd_params:
        filters: 128
        max_filters: 1024
        filters_scale: 1
        dilations: [1, 2, 4]
        hop_lengths: [512, 256, 256]
        n_octaves: [9, 9, 9]
        bins_per_octaves: [24, 36, 48]
        sampling_rate: 44100   # Should be the same as sampling rate in the feature extraction setting
    mpd_type: HiFiGANMultiPeriodDiscriminator
    mpd_params:
        periods: [2, 3, 5, 7, 11]              # List of period for multi-period discriminator.
        discriminator_params:
            in_channels: 1                     # Number of input channels.
            out_channels: 1                    # Number of output channels.
            kernel_sizes: [5, 3]               # List of kernel sizes.
            channels: 32                       # Initial number of channels.
            downsample_scales: [3, 3, 3, 3, 1] # Downsampling scales.
            max_downsample_channels: 1024      # Maximum number of channels in downsampling conv layers.
            nonlinear_activation: "LeakyReLU"  # Nonlinear activation.
            nonlinear_activation_params:       # Nonlinear activation paramters.
                negative_slope: 0.1
            use_weight_norm: true              # Whether to apply weight normalization.
            use_spectral_norm: false           # Whether to apply spectral normalization.


###########################################################
#                   STFT LOSS SETTING                     #
###########################################################
use_stft_loss: false     # Whether to use multi-resolution STFT loss.
use_duration_loss: false # Whether to use duration prediction loss (need for duration predictor)
use_mel_loss: false      # Whether to use Mel-spectrogram loss.
use_multiscale_mel_loss: true
generator_adv_loss_params:
    loss_type: "mse"
    average_by_discriminators: false # Whether to average loss by #discriminators.
discriminator_adv_loss_params:
    loss_type: "mse"
    average_by_discriminators: false # Whether to average loss by #discriminators.
use_feat_match_loss: true
feat_match_loss_params:
    average_by_discriminators: false # Whether to average loss by #discriminators.
    average_by_layers: false         # Whether to average loss by #layers in each discriminator.
    include_final_outputs: true      # Whether to include final outputs in feat match loss calculation.

###########################################################
#               ADVERSARIAL LOSS SETTING                  #
###########################################################
lambda_aux: 15.0       # Loss balancing coefficient for Mel loss.
lambda_adv: 1.0        # Loss balancing coefficient for adversarial loss.
lambda_feat_match: 2.0 # Loss balancing coefficient for feat match loss.

###########################################################
#                  DATA LOADER SETTING                    #
###########################################################
batch_size: 8              # Batch size.
batch_max_steps: 16384     # Length of each audio in batch. Make sure dividable by hop_size. 2^14 = 16384. 16384 / 44100 = 0.37 seconds.
pin_memory: true           # Whether to pin memory in Pytorch DataLoader.
num_workers: 4             # Number of workers in Pytorch DataLoader.
remove_short_samples: false # Whether to remove samples the length of which are less than batch_max_steps.
# drop_last=True
allow_cache: false           # Whether to allow cache in dataset. If true, it requires cpu memory.

###########################################################
#             OPTIMIZER & SCHEDULER SETTING               #
###########################################################
generator_optimizer_type: AdamW
generator_optimizer_params:
    lr: 0.0001
    betas: [0.8, 0.99]
generator_scheduler_type: ExponentialLR
generator_scheduler_params:
    gamma: 0.9999996 # i.e., lr_decay
generator_grad_norm: 500
discriminator_optimizer_type: AdamW
discriminator_optimizer_params:
    lr: 0.0001
    betas: [0.8, 0.99]
discriminator_scheduler_type: ExponentialLR
discriminator_scheduler_params:
    gamma: 0.9999996 # i.e., lr_decay
discriminator_grad_norm: 500

###########################################################
#                    INTERVAL SETTING                     #
###########################################################
generator_train_start_steps: 0     # Number of steps to start to train discriminator.
discriminator_train_start_steps: 0 # Number of steps to start to train discriminator.
train_max_steps: 300000            # Number of training steps.
save_interval_steps: 50000         # Interval steps to save checkpoint.
eval_interval_steps: 10000         # Interval steps to evaluate the network.
log_interval_steps: 100            # Interval steps to record the training log.

###########################################################
#                     OTHER SETTING                       #
###########################################################
num_save_intermediate_results: 4  # Number of results to be saved as intermediate results.

